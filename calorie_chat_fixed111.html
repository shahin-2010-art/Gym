
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calorie Counter with Voice Chat</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: url('https://i.ibb.co/JBPDfN3/discipline-man.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #333;
      padding: 2rem;
    }
    .container {
      background: rgba(255, 255, 255, 0.9);
      max-width: 500px;
      margin: 0 auto;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    input, button {
      display: block;
      width: 100%;
      margin: 0.5rem 0;
      padding: 0.75rem;
      font-size: 1rem;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #27ae60;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #219150;
    }
    #log p {
      margin: 0.3rem 0;
    }
    .status {
      margin-top: 1rem;
      font-weight: bold;
    }
    #chatButton {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background-color: #2c3e50;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      z-index: 1000;
    }
    #chatContainer {
      position: fixed;
      bottom: 70px;
      left: 20px;
      width: 300px;
      max-height: 400px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      display: none;
      flex-direction: column;
      z-index: 999;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    #chatLogBox {
      padding: 10px;
      height: 250px;
      overflow-y: auto;
      font-size: 0.9rem;
    }
    #chatInput {
      display: flex;
      border-top: 1px solid #ccc;
    }
    #chatInput input {
      flex: 1;
      border: none;
      padding: 10px;
      font-size: 1rem;
    }
    #chatInput button {
      border: none;
      background: #27ae60;
      color: white;
      padding: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Calorie Counter</h1>
    <p>Daily Calorie Goal: <strong>3000 kcal</strong></p>

    <input type="text" id="foodName" placeholder="e.g. 2 eggs, 1 slice bread" />
    <button onclick="addCaloriesAI()">Add With AI</button>

    <input type="text" id="manualName" placeholder="Food name (manual)" />
    <input type="number" id="manualCals" placeholder="Calories" />
    <button onclick="addManualCalories()">Add Manually</button>

    <div id="log"></div>
    <div class="status">
      <p id="total">Total: 0 kcal</p>
      <p id="remaining">Remaining: 3000 kcal</p>
    </div>
  </div>

  <button id="chatButton">🤖 ChatGPT</button>

  <div id="chatContainer">
    <div id="chatLogBox"></div>
    <div id="chatInput">
      <input type="text" id="chatMessage" placeholder="Sualını yaz..." />
      <button onclick="sendToChat()">Göndər</button>
    </div>
  </div>

  <script>
    let totalCalories = 0;
    const dailyGoal = 3000;
    const log = document.getElementById('log');
    const totalDisplay = document.getElementById('total');
    const remainingDisplay = document.getElementById('remaining');

    function estimateCaloriesPerUnit(food) {
      const lowerFood = food.toLowerCase();
      if (lowerFood.includes("apple")) return 95;
      if (lowerFood.includes("banana")) return 105;
      if (lowerFood.includes("egg")) return 78;
      if (lowerFood.includes("rice")) return 200;
      if (lowerFood.includes("chicken")) return 250;
      if (lowerFood.includes("bread")) return 80;
      if (lowerFood.includes("milk")) return 120;
      if (lowerFood.includes("pizza")) return 300;
      if (lowerFood.includes("burger")) return 500;
      if (lowerFood.includes("salad")) return 150;
      return 100;
    }

    function extractPortion(text) {
      const match = text.match(/^(\d+(\.\d+)?)\s*(.*)$/);
      if (match) {
        const amount = parseFloat(match[1]);
        const food = match[3];
        return { amount, food };
      }
      return { amount: 1, food: text };
    }

    function addCaloriesAI() {
      const rawInput = document.getElementById('foodName').value.trim();
      if (!rawInput) return;

      const parts = rawInput.split(',');
      let addedCalories = 0;

      for (let part of parts) {
        const { amount, food } = extractPortion(part.trim());
        const perUnit = estimateCaloriesPerUnit(food);
        const cals = perUnit * amount;
        addedCalories += cals;

        const entry = document.createElement('p');
        entry.textContent = `${amount} ${food}: ${cals} kcal`;
        log.appendChild(entry);
      }

      totalCalories += addedCalories;
      totalDisplay.textContent = `Total: ${totalCalories} kcal`;
      remainingDisplay.textContent = `Remaining: ${Math.max(0, dailyGoal - totalCalories)} kcal`;

      document.getElementById('foodName').value = '';
    }

    function addManualCalories() {
      const name = document.getElementById('manualName').value.trim();
      const cals = parseInt(document.getElementById('manualCals').value);
      if (!name || isNaN(cals)) return;

      totalCalories += cals;

      const entry = document.createElement('p');
      entry.textContent = `${name}: ${cals} kcal`;
      log.appendChild(entry);

      totalDisplay.textContent = `Total: ${totalCalories} kcal`;
      remainingDisplay.textContent = `Remaining: ${Math.max(0, dailyGoal - totalCalories)} kcal`;

      document.getElementById('manualName').value = '';
      document.getElementById('manualCals').value = '';
    }

    const chatButton = document.getElementById("chatButton");
    const chatContainer = document.getElementById("chatContainer");
    const chatLogBox = document.getElementById("chatLogBox");

    chatButton.addEventListener("click", () => {
      const isOpen = chatContainer.style.display === "flex";
      chatContainer.style.display = isOpen ? "none" : "flex";
      if (!isOpen) {
        chatContainer.style.flexDirection = "column";
        document.getElementById("chatMessage").disabled = false;
        document.getElementById("chatMessage").focus();
      }
    });

    const apiKey = "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"; // buraya öz açarını yaz!

    async function sendToChat() {
      const input = document.getElementById("chatMessage");
      const msg = input.value.trim();
      if (!msg) return;

      const userMsg = document.createElement("div");
      userMsg.innerHTML = `<strong>Sən:</strong> ${msg}`;
      chatLogBox.appendChild(userMsg);
      chatLogBox.scrollTop = chatLogBox.scrollHeight;

      input.value = '';
      input.disabled = true;

      try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + apiKey,
          },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [{ role: "user", content: msg }],
          }),
        });

        const data = await response.json();
        const botMsg = document.createElement("div");
        botMsg.innerHTML = `<strong>ChatGPT:</strong> ${data.choices[0].message.content}`;
        chatLogBox.appendChild(botMsg);
        chatLogBox.scrollTop = chatLogBox.scrollHeight;

      } catch (error) {
        const errorMsg = document.createElement("div");
        errorMsg.innerHTML = `<strong>ChatGPT:</strong> Xəta baş verdi. Yenidən cəhd et.`;
        chatLogBox.appendChild(errorMsg);
      }

      input.disabled = false;
      input.focus();
    }
  </script>
</body>
</html>
